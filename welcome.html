<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIO 004 Human Anatomy &middot; Learning Guide</title>
<style>html,body{margin:0;background:#FAFAF9;color:#1E3D4C;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}main{padding:40px 20px}a{color:#A0522D;font-weight:700}</style>
<script>
/* One front door. This page sends every student to the Learning Guide
   for their class. The class comes from ?sec= on the link, or from the
   choice they already made (saved by the guide and the dock); with
   neither, learning-guide.html asks once.
     ?sec=mw      Mon / Wed
     ?sec=tr-am   Tue / Thu morning
     ?sec=tr-eve  Tue / Thu evening
   The faculty tool hub that used to be index.html is at faculty-tools.html.
   The old welcome page is kept at welcome-old-fall2026.html. */
(function () {
  var sec = null;
  try {
    var m = location.search.match(/[?&]sec=(mw|tr-am|tr-eve)\b/);
    sec = m ? m[1] : localStorage.getItem('bio004-section');
  } catch (e) {}
  if (sec !== 'mw' && sec !== 'tr-am' && sec !== 'tr-eve') sec = null;
  var url = sec ? 'learning-guide-' + sec + '.html' : 'learning-guide.html';
  location.replace(url + location.hash);
})();
</script>
</head>
<body>
<main><p>Opening the Learning Guide. <a href="learning-guide.html">Open it here</a> if nothing happens.</p></main>
</body>
</html>
